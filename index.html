<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ตารางเวร สิบเวร · ร้อย.ทม.ที่ 2 ทม.รอ.พัน 2</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@500;600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF7F2;font-family:'Noto Sans Thai',system-ui,sans-serif;color:#2B2A28}
button,select,input{font-family:inherit}
.row{width:max-content;min-width:100%;display:grid;background:#fff;border-bottom:1px solid #F1ECE4;align-items:center}
.row.hit{background:#FFF4D6}
.row.dim{opacity:.35}
.nmcell{position:sticky;left:0;z-index:2;background:inherit;padding:8px 8px 8px 14px;box-sizing:border-box;display:flex;flex-direction:column;gap:1px;min-height:52px;justify-content:center;box-shadow:6px 0 8px -6px rgba(60,40,20,.12)}
.cell{height:52px;display:flex;align-items:center;justify-content:center;box-sizing:border-box;border-left:1px solid #EFE9DF}
.cell.tc{background:#FBF0E8}
.pill{display:inline-flex;align-items:center;justify-content:center;min-width:34px;height:26px;padding:0 6px;border-radius:999px;font-size:11px;font-weight:600;white-space:nowrap}
.pill.sv{background:#F9D6D6;color:#7C1A1A}
.pill.bk{background:#CFE3F6;color:#123F6B}
.pill.sp{background:#CDE8D6;color:#17492B}
.pill.lv{background:#E9E5DC;color:#4F4C46}
.pill.bz{background:#F3E6C8;color:#6B4E0B}
.hd{width:max-content;min-width:100%;display:grid;background:#fff;border-bottom:1px solid #EAE4D8;position:sticky;top:0;z-index:4;box-shadow:0 6px 8px -6px rgba(60,40,20,.12)}
.hdname{position:sticky;left:0;z-index:5;background:#fff;display:flex;align-items:flex-end;padding:10px 14px;font-size:12px;color:#8A857C;box-shadow:6px 0 8px -6px rgba(60,40,20,.12)}
.dh{border:0;border-left:1px solid #EFE9DF;background:transparent;padding:8px 0;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:#8A857C;font-size:11px;min-height:56px}
.dh b{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-size:14px;font-weight:600;color:#2B2A28}
.dh.today b{background:#8C5A45;color:#fff}
.dh.sel b{box-shadow:0 0 0 2px #8C5A45}
.lbl{position:sticky;left:0;width:220px;padding:14px 14px 6px 14px;box-sizing:border-box;font-size:12px;color:#8A857C;letter-spacing:.02em}
.legpill{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:#5D5A54}
.seg{flex:1;min-height:44px;border:0;border-radius:999px;background:transparent;font-size:15px;font-weight:500;color:#5D5A54;cursor:pointer}
.seg.on{background:#fff;color:#2B2A28;font-weight:600;box-shadow:0 2px 10px rgba(60,40,20,.1)}
.mon{min-height:44px;padding:0 18px;border:1px solid #E3DCCF;border-radius:999px;background:#fff;font-size:14px;color:#5D5A54;cursor:pointer}
.mon.on{background:#8C5A45;border-color:#8C5A45;color:#fff;font-weight:600}
.fld{height:52px;box-sizing:border-box;width:100%;padding:0 16px;border:1px solid #E3DCCF;border-radius:16px;font-size:16px;background:#fff;color:#2B2A28;min-width:0}
.btn{min-height:52px;border:0;border-radius:999px;background:#8C5A45;color:#fff;font-size:16px;font-weight:600;cursor:pointer;padding:0 24px}
.btn[disabled]{background:#D9D2C6;color:#8A857C;cursor:default}
.del{min-height:44px;padding:0 16px;border:1px solid #E3DCCF;border-radius:999px;background:#fff;color:#8C2B2B;font-size:14px;cursor:pointer;white-space:nowrap}
.ty{flex:1;min-height:48px;border:1px solid #E3DCCF;border-radius:16px;background:#fff;font-size:15px;color:#5D5A54;cursor:pointer}
.ty.on{background:#F4EAE2;border-color:#8C5A45;color:#6B3F2E;font-weight:600}
.card{background:#fff;border-radius:24px;padding:20px;box-shadow:0 8px 28px rgba(60,40,20,.07);display:flex;flex-direction:column;gap:12px}
.lrow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid #F7F3EC}
input:focus-visible,button:focus-visible,select:focus-visible{outline:3px solid #B88A6B;outline-offset:2px}

.fld[type=date]{min-width:0;max-width:100%;-webkit-appearance:none;appearance:none;text-align:left;display:block}
.mons{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
.mons .mon{flex:none}
.sk{padding:40px 0;text-align:center;color:#8A857C;font-size:14px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2B2A28;color:#fff;border-radius:999px;padding:10px 18px;font-size:14px;z-index:50;max-width:90vw}
.chip{display:inline-block;border-radius:999px;padding:6px 12px;font-size:13px;line-height:1.4}
.chip.ok{background:#CDE8D6;color:#17492B}
.chip.warn{background:#F9D6D6;color:#7C1A1A}
.chip.mut{background:#EFE9DF;color:#5D5A54}
</style>
</head>
<body>
<div id="app" style="max-width:760px;margin:0 auto;padding:0 0 40px 0;box-sizing:border-box"><div class="sk">กำลังโหลดตารางเวร…</div></div>
<div id="toast" class="toast" style="display:none"></div>
<script src="js/config.js"></script>
<script src="js/seed.js"></script>
<script src="js/engine.js"></script>
<script src="js/app.js"></script>
</body>
</html>
